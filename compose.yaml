# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  api:
    image: iris-api
    build:
      context: .
      dockerfile: src/Iris.WebApi/Dockerfile
    environment:
      - ConnectionStrings__Redis=redis:6379
      - HttpClients__BCB__BaseUrl=https://api.bcb.gov.br
      - HttpClients__BCB__TimeoutInSeconds=60
      - Otlp__Endpoint=http://otel-collector:4317
      - ASPNETCORE_URLS=http://+:5164
      - ASPNETCORE_ENVIRONMENT=Production
    expose:
      - 5164
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure 
      resources:
        limits:
          cpus: 0.5
          memory: 256M
    networks:
      - iris-network

  nginx:
    image: nginx:1.29.1-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 3333:3333
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
    networks:
      - iris-network      

  redis:
    image: redis/redis-stack:7.4.0-v1
    ports:
      - 6379:6379
    environment:
      - REDIS_ARGS=--appendonly no --save ""
    networks:
      - iris-network     

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: [ "--config=/etc/otel-collector.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9201:9201"
    networks:
      - iris-network

  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - iris-network

  prometheus:
    image: prom/prometheus:v3.5.1
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - iris-network

  loki:
    image: grafana/loki:3.6.5
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml      
    networks:
      - iris-network

  grafana:
    image: grafana/grafana:9.3.2
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
    networks:
      - iris-network

  k6-load-test:
    image: grafana/k6:1.2.1
    networks:
      - iris-network
    ports:
      - "6565:6565"
    volumes:
      - ./tests/Iris.WebApi.LoadTests:/scripts
    depends_on:
      - grafana

volumes:
  tempo-data:

networks:
  iris-network:
    driver: bridge      